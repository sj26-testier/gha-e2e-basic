name: di-id real OIDC proof
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  id-token: write
jobs:
  identity:
    name: Real OIDC CLI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect native provider context without revealing values
        run: |
          python3 - <<'PY'
          import json, os, shutil
          print('ID_CONTEXT ' + json.dumps({
              'present': {key: bool(os.getenv(key)) for key in [
                  'BUILDKITE', 'BUILDKITE_JOB_ID', 'BUILDKITE_AGENT_ACCESS_TOKEN',
                  'BUILDKITE_AGENT_JOB_API_SOCKET', 'GITHUB_ACTIONS',
                  'ACTIONS_ID_TOKEN_REQUEST_URL', 'ACTIONS_ID_TOKEN_REQUEST_TOKEN']},
              'buildkite_agent_on_path': shutil.which('buildkite-agent') is not None}))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact candidate and independent JWT verifier
        run: |
          python3 -m venv .id-venv
          .id-venv/bin/python -m pip install ./candidate 'PyJWT[crypto]==2.10.1'
      - name: Probe real provider and verify issuer signature
        run: .id-venv/bin/python proof.py
