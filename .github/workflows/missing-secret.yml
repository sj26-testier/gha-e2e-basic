name: Missing secret UX reproduction
on:
  push:
    branches: [lab/r-ebea45ea1103]
permissions: {}
jobs:
  missing-secret:
    name: Deliberately absent secret
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Agent reached the workflow
        run: echo "LAB_MISSING_SECRET_REPRO started; no real secrets used"
      - name: Read deliberately absent secret
        env:
          REQUIRED_VALUE: ${{ secrets.LAB_DELIBERATELY_MISSING_SECRET_EBEA45EA1103 }}
        run: |
          if [ -z "$REQUIRED_VALUE" ]; then
            echo "LAB_MISSING_SECRET_REPRO native empty-string fallback"
          else
            echo "LAB_MISSING_SECRET_REPRO unexpected configured value"
            exit 1
          fi
